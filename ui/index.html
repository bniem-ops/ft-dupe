<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flock Together</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bevan&family=Cabin:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
  <script type="importmap">
  {
    "imports": {
      "preact": "./vendor/preact.js",
      "preact/hooks": "./vendor/hooks.js",
      "htm": "./vendor/htm.js",
      "htm/preact": "./vendor/htm-preact.js",
      "#data/generated.mjs": "../data/generated.mjs"
    }
  }
  </script>
</head>
<body>
  <!-- Painterly chrome filters (docs/design-handoff: painterly) — inert,
       0x0, referenced by url(#id) from styles.css. A displacement filter
       must never sit on an element that contains text; it goes on a
       backdrop layer (.paper/.brushfill) with text on an unfiltered layer
       above it. -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
    <filter id="deckle" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="4" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="deckle2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.06" numOctaves="3" seed="21" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="wash" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs></svg>
  <div id="app"></div>
  <script src="../data/firebase-config.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
