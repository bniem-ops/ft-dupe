name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build data from txt templates
        run: node scripts/build_data.js
      - name: Compile the TypeScript engine
        run: npm run build
      - name: Cache-bust asset URLs
        run: node scripts/cachebust.js
      # Stage only what's actually served — `ui/src/engine.js` imports
      # engine/dist via a relative path (`../../engine/dist/src/index.js`),
      # so it has to sit next to ui/ and data/ at the artifact root, same
      # relative layout as the repo itself. Staging (rather than uploading
      # the checkout root directly) keeps .git/ and node_modules/ out of
      # the deployed site.
      - name: Stage site
        run: |
          mkdir -p _site/engine
          cp -r ui _site/ui
          cp -r data _site/data
          cp -r engine/dist _site/engine/dist
          cp index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
